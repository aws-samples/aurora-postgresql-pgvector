name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  python-compile:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile all .py files
        run: |
          find . -name "*.py" -not -path "*/node_modules/*" | xargs python -m py_compile

  notebooks-valid:
    name: Validate notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install nbformat
        run: pip install nbformat
      - name: Validate all .ipynb files
        run: |
          python - <<'EOF'
          import sys, pathlib, nbformat
          errors = []
          for nb_path in pathlib.Path(".").rglob("*.ipynb"):
              try:
                  nbformat.read(nb_path.open(), as_version=4)
              except Exception as e:
                  errors.append(f"{nb_path}: {e}")
          if errors:
              print("Notebook validation errors:")
              for err in errors:
                  print(" ", err)
              sys.exit(1)
          print(f"All notebooks valid.")
          EOF

      - name: Compile notebook code cells
        run: |
          python - <<'EOF'
          import ast, pathlib, sys
          import nbformat

          errors = []
          for nb_path in sorted(pathlib.Path(".").rglob("*.ipynb")):
              nb = nbformat.read(nb_path.open(), as_version=4)
              for i, cell in enumerate(nb.cells):
                  if cell.cell_type != "code":
                      continue
                  lines = "".join(cell.source).splitlines()
                  # A %%cell magic means the body is not Python at all -- skip it.
                  first = next((l for l in lines if l.strip()), "")
                  if first.lstrip().startswith("%%"):
                      continue
                  # Blank only the magic / shell-escape lines, keeping line numbers aligned
                  # so reported line numbers still point at the real offending line.
                  src = "\n".join(
                      "" if l.lstrip().startswith(("%", "!")) else l
                      for l in lines
                  )
                  try:
                      ast.parse(src)
                  except SyntaxError as e:
                      errors.append(f"{nb_path} cell {i}: {type(e).__name__}: {e.msg} (line {e.lineno})")
          if errors:
              print("Notebook code cells failed to compile:")
              for err in errors:
                  print(" ", err)
              sys.exit(1)
          print("All notebook code cells compile.")
          EOF

      - name: Check for banned dependencies
        run: |
          # pandarallel ships sdist-only and is unmaintained since Oct 2023, so
          # pip must build it at install time -- the reported install failure.
          # setuptools==65.5.0 was pinned only to make that build work.
          status=0
          for token in pandarallel 'setuptools==65.5.0'; do
            if grep -rIn --include='*.ipynb' --include='requirements*.txt' -e "$token" .; then
              echo "ERROR: '$token' was reintroduced (see matches above)"
              status=1
            fi
          done
          exit $status

  # NOTE: 06-incident-detection/strands-agent/requirements.txt is intentionally
  # excluded from the matrix below — strands-agents pulls a large dependency
  # tree that makes dry-run resolution slow; its .py files are covered by the
  # python-compile job.
  requirements-resolve:
    name: Requirements dry-run (${{ matrix.requirements }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        requirements:
          - 01-semantic-search/requirements1.txt
          - 01-semantic-search/requirements2.txt
          - 02-product-recommendations/requirements.txt
          - 03-retrieval-augmented-generation/question-answering-bedrock/requirements.txt
          - 03-retrieval-augmented-generation/response-streaming/requirements.txt
          - 03-retrieval-augmented-generation/question-answering-opensource/requirements.txt
          - 04-aurora-ml-movie-recommendations/requirements.txt
          - 05-blaize-bazaar/requirements.txt
          - 06-incident-detection/ui/requirements.txt
          - 06-incident-detection/script/misc/lambda/s3upload/requirements.txt
          - 07-aurora-ml-chatbot/requirements.txt
          - 08-valkey-chatbot/requirements.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dry-run install ${{ matrix.requirements }}
        run: pip install --dry-run --quiet -r ${{ matrix.requirements }}
